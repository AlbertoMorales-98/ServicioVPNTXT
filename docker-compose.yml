services:
  mock-sftp:
    build:
      context: .
      dockerfile: Dockerfile.mock-sftp
    container_name: mock-sftp
    environment:
      APP_SFTP_MOCK_SERVER_PORT: 2222
      APP_SFTP_MOCK_SERVER_USERNAME: cliente_sftp
      APP_SFTP_MOCK_SERVER_PASSWORD: cambio123
      APP_SFTP_MOCK_SERVER_STORAGE_DIR: /app/storage/mock-sftp-root
      APP_SFTP_MOCK_SERVER_HOST_KEY_PATH: /app/storage/keys/mock-sftp-hostkey.ser
    ports:
      - "2222:2222"
    volumes:
      - ./storage/mock-sftp-root:/app/storage/mock-sftp-root
      - ./storage/keys:/app/storage/keys

  sender:
    build:
      context: .
      dockerfile: Dockerfile.sender
    container_name: sftp-sender
    depends_on:
      - mock-sftp
    environment:
      SERVER_PORT: 8081
      APP_SFTP_SENDER_OUTBOX_DIR: /app/storage/sender-outbox
      APP_SFTP_SENDER_HOST: mock-sftp
      APP_SFTP_SENDER_PORT: 2222
      APP_SFTP_SENDER_USERNAME: cliente_sftp
      APP_SFTP_SENDER_PASSWORD: cambio123
      APP_SFTP_SENDER_REMOTE_DIR: /Datos de facturacion TXT
    ports:
      - "8081:8081"
    volumes:
      - ./storage/sender-outbox:/app/storage/sender-outbox
